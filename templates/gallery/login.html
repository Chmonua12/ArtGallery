{% extends 'base.html' %}

{% block title %}Вход - ArtVerse{% endblock %}

{% block content %}
<div class="auth-container" style="max-width: 400px; margin: 0 auto; padding: 2rem;">
    <div class="auth-card" style="background: white; border-radius: var(--radius); box-shadow: var(--shadow); padding: 2rem;">
        <div class="auth-header" style="text-align: center; margin-bottom: 2rem;">
            <div style="width: 80px; height: 80px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem;">
                <i class="fas fa-palette" style="color: white; font-size: 2rem;"></i>
            </div>
            <h1 style="font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--text); margin-bottom: 0.5rem;">
                С возвращением
            </h1>
            <p style="color: var(--text-light);">Войдите в свой аккаунт ArtVerse</p>
        </div>
        
        <form method="post" class="auth-form">
            {% csrf_token %}
            
            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label for="username" style="display: block; margin-bottom: 0.5rem; color: var(--text); font-weight: 500;">
                    <i class="fas fa-user"></i> Имя пользователя
                </label>
                <input type="text" name="username" id="username" 
                       class="form-control" 
                       style="width: 100%; padding: 0.75rem; border: 2px solid var(--border); border-radius: var(--radius);"
                       required>
            </div>
            
            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label for="password" style="display: block; margin-bottom: 0.5rem; color: var(--text); font-weight: 500;">
                    <i class="fas fa-lock"></i> Пароль
                </label>
                <input type="password" name="password" id="password" 
                       class="form-control" 
                       style="width: 100%; padding: 0.75rem; border: 2px solid var(--border); border-radius: var(--radius);"
                       required>
            </div>
            
            {% if form.errors %}
                <div class="error-message" style="background: #fed7d7; color: #742a2a; padding: 0.75rem; border-radius: var(--radius); margin-bottom: 1.5rem; border-left: 4px solid #e53e3e;">
                    Неверное имя пользователя или пароль.
                </div>
            {% endif %}
            
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; font-size: 1.1rem;">
                <i class="fas fa-sign-in-alt"></i> Войти
            </button>
        </form>
        
        <div class="auth-footer" style="text-align: center; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border);">
            <p style="color: var(--text-light); margin-bottom: 0.5rem;">
                Нет аккаунта? 
                <a href="{% url 'register' %}" style="color: var(--primary); text-decoration: none; font-weight: 500;">
                    Зарегистрироваться
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
